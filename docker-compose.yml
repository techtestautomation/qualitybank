services:
  postgres:
    image: postgres:17
    container_name: qualitybank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - qualitybank-postgres-data:/var/lib/postgresql/data

volumes:
  qualitybank-postgres-data: